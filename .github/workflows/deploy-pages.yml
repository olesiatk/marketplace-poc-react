name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # GROQ_API_KEY is optional. If it's not set as a repo secret, the app
      # builds with no key and the AI search falls back to local heuristic
      # search (see isGroqConfigured in src/app/lib/groq.ts). Add a
      # GROQ_API_KEY secret in repo Settings > Secrets and Actions, then
      # re-run this workflow, to enable live Groq search on the deployed site.
      # Note: because this is a static site, the key ends up readable in the
      # public JS bundle — only use a key you're fine exposing publicly.
      - name: Write .env
        run: echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" > .env

      - name: Build
        run: npm run build -- --configuration production --base-href /poc-ai-marketplace/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/ai-furniture-marketplace-poc/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
