name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Requires ALGOLIA_APP_ID and ALGOLIA_SEARCH_API_KEY repo secrets (Settings
      # > Secrets and Actions) — without them the build has no search config and
      # App renders the "search isn't configured" message (see isAlgoliaConfigured
      # in src/lib/algolia.ts). The search-only key is meant to be public — it
      # can only read the index, not write to it — so it's fine that, because
      # this is a static site, both end up readable in the public JS bundle.
      - name: Write .env
        run: |
          echo "VITE_ALGOLIA_APPLICATION_ID=${{ secrets.ALGOLIA_APP_ID }}" >> .env
          echo "VITE_ALGOLIA_SEARCH_API_KEY=${{ secrets.ALGOLIA_SEARCH_API_KEY }}" >> .env

      - name: Build
        run: npm run build -- --base=/marketplace-poc-react/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
