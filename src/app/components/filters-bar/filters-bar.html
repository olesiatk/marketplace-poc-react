<section class="mx-auto max-w-6xl px-8 pt-6 pb-2" data-tour="filters-bar">
  <p class="eyebrow mb-4">manual filters</p>
  <div class="bg-surface px-7 py-6 grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-5 items-end">
    <app-filter-select
      id="f-category"
      label="Category"
      [value]="filters().category"
      [options]="options().categories"
      placeholder="All categories"
      (valueChange)="onSelectChange('category', $event)"
    />
    <app-filter-select
      id="f-room"
      label="Room"
      [value]="filters().room"
      [options]="options().rooms"
      placeholder="Any"
      (valueChange)="onSelectChange('room', $event)"
    />
    <app-filter-select
      id="f-material"
      label="Material"
      [value]="filters().material"
      [options]="options().materials"
      placeholder="Any"
      (valueChange)="onSelectChange('material', $event)"
    />
    <div>
      <label for="f-price" class="block text-[11px] font-bold uppercase tracking-wide mb-2">Max price, $</label>
      <input
        id="f-price"
        type="range"
        [min]="10"
        [max]="priceLimit()"
        [step]="5"
        [value]="filters().maxPrice"
        (input)="onPriceChange($event)"
        class="w-full"
      />
      <output class="block mt-1.5 text-xs font-bold text-gradient-brand">{{ formatPrice(filters().maxPrice) }}</output>
    </div>
    <div>
      <button
        type="button"
        (click)="reset.emit()"
        class="cta-label border-1 text-ink font-bold uppercase text-xs tracking-wide px-5 py-2.5 hover:bg-ink hover:text-white transition-colors"
      >
        Reset all
      </button>
    </div>
  </div>
</section>
