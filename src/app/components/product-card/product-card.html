<button
  type="button"
  (click)="onSelect()"
  class="bg-surface px-4 py-3.5 flex gap-3.5 text-left w-full cursor-pointer border border-transparent hover:border-transparent hover:[border-image:var(--gradient-brand)_1] hover:-translate-y-0.5 transition-all"
>
  <app-icon [name]="iconName()" [size]="40" class="text-brand-dark shrink-0" />
  <div class="flex-1 min-w-0 flex flex-col">
    @if (matchInfo(); as info) {
      <span class="self-start mb-1 text-[9px] font-bold uppercase tracking-wide bg-highlight text-ink px-1.5 py-0.5">
        AI match · {{ matchCount(info) }} {{ wordFormMatches(matchCount(info)) }}
      </span>
    }
    <p class="text-[10px] font-bold uppercase tracking-wide text-gradient-brand mb-0.5">{{ product().category }}</p>
    <h3 class="text-[13px] font-extrabold uppercase leading-snug mb-1 line-clamp-2 min-h-9">{{ product().name }}</h3>
    <p class="text-xs text-body leading-relaxed mb-2 line-clamp-2 min-h-9.75">{{ product().description }}</p>
    <div class="flex items-center justify-between pt-2 border-t border-line mt-auto">
      <span class="font-extrabold text-sm">{{ formatPrice(product().price) }}</span>
      <span class="flex items-center gap-1 text-xs font-bold text-body">
        <app-icon name="star" [size]="12" class="text-brand-dark" />
        {{ avgRating() }} · {{ reviewList().length }}
      </span>
    </div>
  </div>
</button>
